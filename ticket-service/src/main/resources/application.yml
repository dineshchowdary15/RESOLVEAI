spring:

  application:
    name: ticket-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resolveai}
    username: ${DB_USERNAME:resolveai}
    password: ${DB_PASSWORD:resolveai_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always