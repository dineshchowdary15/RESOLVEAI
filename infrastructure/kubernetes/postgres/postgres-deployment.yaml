apiVersion: apps/v1
kind: Deployment

metadata:
  name: resolveai-postgres
  namespace: resolveai

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: resolveai-postgres

  template:
    metadata:
      labels:
        app: resolveai-postgres

    spec:
      containers:
        - name: postgres

          image: pgvector/pgvector:pg17

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: resolveai-postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: resolveai-postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resolveai-postgres-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - resolveai
                - -d
                - resolveai

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - resolveai
                - -d
                - resolveai

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

      volumes:
        - name: postgres-storage

          persistentVolumeClaim:
            claimName: resolveai-postgres-pvc