apiVersion: apps/v1
kind: Deployment

metadata:
  name: resolveai-ai-service
  namespace: resolveai

spec:
  replicas: 1

  selector:
    matchLabels:
      app: resolveai-ai-service

  template:
    metadata:
      labels:
        app: resolveai-ai-service

    spec:
      containers:
        - name: ai-service

          image: resolveai-ai-service:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: resolveai-ai-secret
                  key: DATABASE_URL

            - name: OLLAMA_HOST
              valueFrom:
                configMapKeyRef:
                  name: resolveai-ai-config
                  key: OLLAMA_HOST

            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: resolveai-ai-config
                  key: OLLAMA_MODEL

            - name: EMBEDDING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: resolveai-ai-config
                  key: EMBEDDING_MODEL

            - name: USE_LLM
              valueFrom:
                configMapKeyRef:
                  name: resolveai-ai-config
                  key: USE_LLM

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5